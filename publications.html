<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Publications — Vardhan Dongre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/theme-init.js"></script>
</head>
<body data-root="" data-page="publications">

<div class="shell">
  <div class="content">
    <div class="content-inner">

      <div class="section-head" style="margin-top:0">
        <h1 style="font-size:34px">Publications</h1>
        <a class="more" href="https://scholar.google.com/citations?user=sSt2OvIAAAAJ&hl=en">Google Scholar &rarr;</a>
      </div>
      <div class="stats" id="stats"></div>

      <div class="card">
        <div class="filters" role="group" aria-label="Filter by type">
          <span class="label">Show</span>
          <button class="chip" data-type="all" aria-pressed="true">All</button>
          <button class="chip" data-type="conference" aria-pressed="false">Conference</button>
          <button class="chip" data-type="journal" aria-pressed="false">Journal</button>
          <button class="chip" data-type="workshop" aria-pressed="false">Workshop</button>
          <button class="chip" data-type="preprint" aria-pressed="false">Preprint</button>
        </div>
        <div id="all-pubs"></div>
        <p class="empty" hidden>Nothing matches this filter.</p>
      </div>

      <footer class="site">
        <span>&copy; 2026 Vardhan Dongre</span>
        <span><a href="index.html">Back to home</a></span>
      </footer>

    </div>
  </div>
</div>

<script src="assets/site.js"></script>
<script src="assets/publications.js"></script>
<script>
  var container = document.getElementById('all-pubs');
  var all = renderPublications(container, { groupByYear: true, compact: true });

  // Counts per type, shown on chips and in the stats row
  var counts = {};
  all.forEach(function(p){ counts[p.type] = (counts[p.type] || 0) + 1; });
  document.querySelectorAll('.chip').forEach(function(c){
    var t = c.dataset.type, n = t === 'all' ? all.length : (counts[t] || 0);
    c.insertAdjacentHTML('beforeend', '<span class="n">' + n + '</span>');
  });
  var years = all.map(function(p){ return p.year; });
  document.getElementById('stats').innerHTML =
    '<div><b>' + all.length + '</b>papers</div>' +
    '<div><b>' + (counts.conference || 0) + '</b>conference</div>' +
    '<div><b>' + (counts.journal || 0) + '</b>journal</div>' +
    '<div><b>' + Math.min.apply(null, years) + '&ndash;' + Math.max.apply(null, years) + '</b></div>';

  var empty = document.querySelector('.empty');
  function applyFilter(type){
    var any = false;
    container.querySelectorAll('.pub').forEach(function(el){
      var show = type === 'all' || el.dataset.type === type;
      el.hidden = !show; if (show) any = true;
    });
    container.querySelectorAll('.year-group').forEach(function(g){
      g.hidden = g.querySelectorAll('.pub:not([hidden])').length === 0;
    });
    empty.hidden = any;
  }
  document.querySelectorAll('.chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      applyFilter(btn.dataset.type);
    });
  });
</script>
</body>
</html>
