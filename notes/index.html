<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notes — Vardhan Dongre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css?v=6">
<script src="../assets/theme-init.js?v=6"></script>
</head>
<body data-root="../" data-page="notes">

<div class="shell">
  <div class="content">
    <div class="content-inner">

      <div class="section-head" style="margin-top:0;flex-direction:column;align-items:flex-start;gap:8px">
        <h1 style="font-size:34px">Notes</h1>
        <p style="margin:0;color:var(--ink-soft);font-size:17px;line-height:1.65;max-width:60ch">Research summaries, paper notes, and the occasional position piece on language models, multimodal systems, and where things might be heading.</p>
      </div>

      <div class="card">
        <div class="filters" role="group" aria-label="Filter by tag" id="tag-filters">
          <span class="label">Filter</span>
          <button class="chip" data-tag="all" aria-pressed="true">All</button>
        </div>
        <div id="post-list" class="post-list"></div>
        <p class="empty" hidden>No notes match this filter yet.</p>
      </div>

      <footer class="site">
        <span>&copy; 2026 Vardhan Dongre</span>
        <span><a href="../index.html">Back to home</a></span>
      </footer>

    </div>
  </div>
</div>

<script src="../assets/site.js?v=6"></script>
<script src="../assets/posts.js?v=6"></script>
<script>
  var list = document.getElementById('post-list');
  var filters = document.getElementById('tag-filters');
  var empty = document.querySelector('.empty');

  list.innerHTML = POSTS.map(function(p){
    return '<div class="post-row" data-tags="' + p.tags.join('|') + '">' +
      '<span class="t"><a href="' + p.slug + '.html">' + p.title + '</a></span>' +
      '<span class="d">' + formatPostDate(p.date) + (p.minutes ? ' &middot; ' + p.minutes + ' min' : '') + '</span>' +
      '<span class="s">' + p.summary + '</span>' +
      '<span class="tags">' + p.tags.map(function(t){ return '<span>' + t + '</span>'; }).join('') + '</span>' +
    '</div>';
  }).join('');

  // Build tag chips from the data
  var tags = [];
  POSTS.forEach(function(p){ p.tags.forEach(function(t){ if (tags.indexOf(t) < 0) tags.push(t); }); });
  tags.sort().forEach(function(t){
    filters.insertAdjacentHTML('beforeend', '<button class="chip" data-tag="' + t + '" aria-pressed="false">' + t + '</button>');
  });

  function applyFilter(tag){
    var any = false;
    list.querySelectorAll('.post-row').forEach(function(row){
      var show = tag === 'all' || row.dataset.tags.split('|').indexOf(tag) >= 0;
      row.hidden = !show; if (show) any = true;
    });
    empty.hidden = any;
  }
  filters.addEventListener('click', function(e){
    var btn = e.target.closest('.chip'); if (!btn) return;
    filters.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
    applyFilter(btn.dataset.tag);
  });
</script>
</body>
</html>
